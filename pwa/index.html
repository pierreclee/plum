<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#534AB7">
  <meta name="description" content="L'actualité simple, rapide, apolitique.">
  <title>Plum</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/icon-192.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #f5f5f7; color: #1a1a2e; min-height: 100vh; }

    header {
      background: #534AB7; color: white; padding: 14px 20px;
      display: flex; justify-content: space-between; align-items: center;
      position: sticky; top: 0; z-index: 100;
      box-shadow: 0 2px 8px rgba(83,74,183,0.3);
    }
    header h1 { font-size: 1.35rem; font-weight: 700; letter-spacing: -0.02em; }
    .streak-badge {
      font-size: 0.8rem; font-weight: 600;
      background: rgba(255,255,255,0.2); padding: 4px 12px;
      border-radius: 20px; white-space: nowrap;
    }

    nav {
      display: flex; gap: 8px; padding: 10px 16px;
      overflow-x: auto; background: white;
      border-bottom: 1px solid #ebebeb;
      scrollbar-width: none;
    }
    nav::-webkit-scrollbar { display: none; }
    nav button {
      border: none; background: #f0eeff; color: #534AB7;
      padding: 6px 16px; border-radius: 20px; cursor: pointer;
      font-size: 0.82rem; font-weight: 500; white-space: nowrap;
      transition: background 0.15s, color 0.15s;
    }
    nav button.active { background: #534AB7; color: white; }

    #offlineBanner {
      display: none; background: #ff9500; color: white;
      text-align: center; padding: 8px 16px; font-size: 0.82rem;
    }

    #feed { padding: 16px; max-width: 680px; margin: 0 auto; }
    .loading { text-align: center; padding: 48px 0; color: #aaa; font-size: 0.95rem; }

    .card {
      background: white; border-radius: 14px; padding: 16px 18px;
      margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.07);
    }
    .card-category {
      font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em;
      color: #534AB7; font-weight: 700; margin-bottom: 6px;
    }
    .card-title { font-size: 1rem; font-weight: 600; line-height: 1.4; margin-bottom: 8px; }
    .card-summary { font-size: 0.88rem; color: #555; line-height: 1.55; margin-bottom: 10px; }
    .card-meta { font-size: 0.73rem; color: #bbb; display: flex; gap: 10px; flex-wrap: wrap; }
  </style>
</head>
<body>

<div id="offlineBanner">
  Hors ligne — affichage du dernier feed disponible
</div>

<header>
  <h1>🐦 Plum</h1>
  <span class="streak-badge" id="streakBadge"></span>
</header>

<nav id="categoriesNav"></nav>

<main id="feed">
  <div class="loading">Chargement des actualités…</div>
</main>

<script src="/app/streak.js"></script>
<script src="/app/categories.js"></script>
<script src="/app/feed.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(console.error);
  }
</script>
<script defer data-domain="plum.app" src="https://plausible.io/js/script.js"></script>
</body>
</html>
